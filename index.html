<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#3B241D">
  <meta name="application-name" content="커피당번">

  <!-- iPhone 홈 화면 앱 -->
  <meta name="apple-mobile-web-app-title" content="커피당번">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta
    name="description"
    content="우리 부서 커피 캘린더"
  >

  <title>커피당번</title>

  <!-- 아이콘 -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png?v=20260911"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png?v=20260911"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #F7F2EE;

      font-family:
        system-ui,
        -apple-system,
        "Malgun Gothic",
        sans-serif;
    }


    /* =====================================================
       설치 안내 화면
       ===================================================== */

    #installPage {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      display: grid;
      place-items: center;

      color: #3B241D;
    }

    #installPage main {
      width: min(100%, 480px);
    }

    .identity {
      text-align: center;
      margin-bottom: 28px;
    }

    .identity img {
      width: 112px;
      height: 112px;

      border-radius: 24px;

      box-shadow:
        0 8px 24px
        rgba(59, 36, 29, 0.14);
    }

    h1 {
      font-size: 1.65rem;
      line-height: 1.3;

      margin: 18px 0 8px;
    }

    p {
      margin: 8px 0;
      color: #69544B;
    }

    article {
      margin: 24px 0;
      padding: 20px;

      background: #FFFFFF;

      border: 1px solid #E4D6CE;
      border-radius: 16px;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 12px;
    }

    ol {
      padding-left: 22px;
      margin: 0;
    }

    li {
      margin: 10px 0;
    }

    .small {
      font-size: 0.875rem;
    }

    .device {
      font-weight: 750;
      color: #3B241D;
    }

    .notice {
      padding: 12px;
      border-radius: 10px;

      background: #EEE3DA;
    }

    .url {
      word-break: break-all;

      font-size: 0.8rem;
      color: #765F51;
    }


    /* =====================================================
       실제 앱 화면
       ===================================================== */

    #appPage {
      position: fixed;
      inset: 0;

      display: none;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background: #F7F2EE;
    }

    #coffeeApp {
      display: block;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      border: 0;

      background: #F7F2EE;
    }


    /* =====================================================
       홈 화면 앱으로 실행했을 때
       ===================================================== */

    @media (display-mode: standalone) {

      #installPage {
        display: none;
      }

      #appPage {
        display: block;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       Safari / Chrome에서 접속했을 때
       홈 화면 추가 안내
       ===================================================== -->

  <div id="installPage">

    <main>

      <div class="identity">

        <img
          src="./icon-192.png"
          width="112"
          height="112"
          alt="커피당번 아이콘"
        >

        <h1>
          우리 부서 커피
        </h1>

        <p>
          오늘의 담당과 점심 일정을 확인하세요.
        </p>

      </div>


      <article>

        <h2>
          홈 화면에 추가하세요
        </h2>

        <ol>

          <li>
            <span class="device">
              iPhone · Safari
            </span>
            <br>
            공유 버튼 → 홈 화면에 추가 → 추가
          </li>

          <li>
            <span class="device">
              Galaxy · Chrome
            </span>
            <br>
            오른쪽 위 ⋮ → 홈 화면에 추가 또는 앱 설치
          </li>

          <li>
            <span class="device">
              Galaxy · 삼성 인터넷
            </span>
            <br>
            메뉴 → 현재 페이지 추가 → 홈 화면
          </li>

        </ol>


        <p class="small notice">
          기존 커피당번 바로가기가 있다면 삭제한 뒤
          현재 페이지에서 다시 홈 화면에 추가하세요.
        </p>


        <p class="url">
          seok19961021.github.io/CoffeeCalendar/
        </p>

      </article>

    </main>

  </div>


  <!-- =====================================================
       홈 화면 아이콘으로 실행했을 때
       Apps Script를 앱 내부에 표시
       ===================================================== -->

  <div id="appPage">

    <iframe
      id="coffeeApp"
      src="https://script.google.com/macros/s/AKfycbwRVhzQG2H0Y-Zw2q51FCCIDbKfF7R21r5asUaK4z1ibj2Wh2l-4KaDXlc8vcfH9T0/exec"
      title="우리 부서 커피"
      allow="fullscreen"
    ></iframe>

  </div>


  <script>

    /*
     * 일부 iOS 버전의 standalone 판정을
     * JavaScript에서도 한 번 더 확인
     */

    const standalone =
      window.matchMedia('(display-mode: standalone)').matches
      ||
      window.navigator.standalone === true;


    if (standalone) {

      document
        .getElementById('installPage')
        .style.display = 'none';


      document
        .getElementById('appPage')
        .style.display = 'block';

    }

  </script>


</body>

</html>
