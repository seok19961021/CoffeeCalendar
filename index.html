<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>우리 부서 커피 당번</title>

  <!-- iPhone / iPad 홈 화면 아이콘 -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./coffee-icon.png?v=30"
  >

  <!-- Android / 일반 브라우저 아이콘 -->
  <link
    rel="icon"
    type="image/png"
    href="./coffee-icon.png?v=30"
  >

  <!-- iPhone 홈 화면 표시 이름 -->
  <meta
    name="apple-mobile-web-app-title"
    content="커피당번"
  >

  <!-- iPhone 홈 화면 실행 -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <!-- Android -->
  <meta
    name="application-name"
    content="커피당번"
  >

  <meta
    name="theme-color"
    content="#3B241D"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #F7F2EE;

      font-family:
        system-ui,
        -apple-system,
        "Malgun Gothic",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading {
      width: 100%;
      text-align: center;
      color: #3B241D;
      padding: 30px;
    }

    .loading img {
      display: block;
      width: 110px;
      height: 110px;
      object-fit: cover;

      margin: 0 auto 18px;

      border-radius: 24px;

      box-shadow:
        0 8px 24px
        rgba(59, 36, 29, 0.18);
    }

    .title {
      margin-bottom: 8px;

      font-size: 1.25rem;
      font-weight: 800;
    }

    .text {
      color: #79665C;
      font-size: 0.9rem;
    }

    .open-button {
      display: inline-block;

      margin-top: 22px;
      padding: 12px 20px;

      border: 0;
      border-radius: 12px;

      background: #6B4A3D;
      color: #FFFFFF;

      font: inherit;
      font-weight: 700;

      cursor: pointer;
    }

    .open-button:active {
      background: #3B241D;
    }
  </style>

</head>


<body>

  <div class="loading">

    <img
      src="./coffee-icon.png?v=30"
      alt="커피당번 아이콘"
    >

    <div class="title">
      우리 부서 커피
    </div>

    <div class="text">
      커피 캘린더를 여는 중입니다.
    </div>

    <button
      id="openButton"
      class="open-button"
      type="button"
    >
      커피 캘린더 열기
    </button>

  </div>


  <script>

    const APP_URL =
      'https://script.google.com/macros/s/AKfycbwRVhzQG2H0Y-Zw2q51FCCIDbKfF7R21r5asUaK4z1ibj2Wh2l-4KaDXlc8vcfH9T0/exec';


    /*
     * 버튼을 누르면 Apps Script Web App으로 이동
     */
    document
      .getElementById('openButton')
      .addEventListener(
        'click',
        function () {
          window.location.href = APP_URL;
        }
      );


    /*
     * 일반 브라우저에서는 잠시 후 자동 이동
     *
     * 2.5초 정도 시간을 두어
     * iPhone에서 홈 화면 추가 작업을 할 수 있도록 함
     */
    setTimeout(
      function () {
        window.location.href = APP_URL;
      },
      2500
    );

  </script>

</body>

</html>
